name: NoRoute Config

on:
  workflow_dispatch:
    inputs:
      target_v4:
        description: 'IPv4 最大条数'
        required: false
        default: '800'
      target_v6:
        description: 'IPv6 最大条数'
        required: false
        default: '800'
      prune_v4:
        description: 'IPv4 裁剪权重 λ（0 = 不裁剪，保证 100% 覆盖）'
        required: false
        default: '4'
      prune_v6:
        description: 'IPv6 裁剪权重 λ（0 = 不裁剪，保证 100% 覆盖）'
        required: false
        default: '0'
  workflow_run:
    workflows: ["ROS CNIP List"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: norange
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate ocserv no-route config
        run: |
          set -euo pipefail
          python3 .github/scripts/norange.py \
            --target-v4 "${{ inputs.target_v4 || 800 }}" \
            --target-v6 "${{ inputs.target_v6 || 800 }}" \
            --prune-v4  "${{ inputs.prune_v4  || 4 }}" \
            --prune-v6  "${{ inputs.prune_v6  || 0 }}"
          head -6 ocserv/no-route-ipv4.conf
          head -6 ocserv/no-route-ipv6.conf

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update ocserv NoRoute config"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
