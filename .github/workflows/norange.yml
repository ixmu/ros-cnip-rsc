name: NoRoute Config

# 触发方式：
#   1. 手动（Actions → NoRoute Config → Run workflow），可调标准档条目数 / 裁剪权重
#   2. push：生成器或本工作流变更时自动重建（.github/**）
#   3. workflow_run：ROS CNIP List 每日更新成功后自动重建
#      列表数据本身不放在 push paths 里，避免同一次更新触发两次运行。
#
# 每次运行生成两套（IPv4 与 IPv6 表按族分别使用，条数预算各自独立）：
#   ocserv/          标准档  1000 v4 + 800 v6，全终端可用
#   ocserv/lite/     精简档  320 v4 + 384 v6，给路由表容量受限的客户端
on:
  workflow_dispatch:
    inputs:
      target_v4:
        description: '标准档 IPv4 最大条数'
        required: false
        default: '1000'
      target_v6:
        description: '标准档 IPv6 最大条数'
        required: false
        default: '800'
      prune_v4:
        description: '标准档 IPv4 裁剪权重 λ（0 = 不裁剪，保证 100% 覆盖）'
        required: false
        default: '1'
      prune_v6:
        description: 'IPv6 裁剪权重 λ（0 = 不裁剪，保证 100% 覆盖，两套共用）'
        required: false
        default: '0'
  push:
    branches: [main]
    paths:
      - '.github/**'
  workflow_run:
    workflows: ["ROS CNIP List"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: norange
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACTION_TOKEN || secrets.GH_TOKEN || github.token }}
          ref: main

      # 只报凭据来源，不回显令牌内容；先 dry-run 推一次一次性 ref，把「令牌没有
      # contents: write」或「已过期」这类问题变成一条明确的告警，而不是让提交步骤
      # 抛一段难以定位的 git 错误。
      - name: Check push credentials
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_TOKEN: ${{ secrets.ACTION_TOKEN || secrets.GH_TOKEN || github.token }}
        run: |
          set -eu
          if [ -n "${ACTION_TOKEN}" ]; then
            src="仓库密钥 ACTION_TOKEN"
          elif [ -n "${GH_TOKEN}" ]; then
            src="仓库密钥 GH_TOKEN"
          else
            src="内置 GITHUB_TOKEN（仓库未配置密钥）"
          fi
          echo "提交与推送使用：${src}"
          probe="https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git push --dry-run "$probe" HEAD:refs/heads/ci/permission-probe >/dev/null 2>&1; then
            echo "contents: write 校验通过"
          else
            echo "::warning::${src} 无法推送：缺少 contents: write 或已过期，提交步骤预计会失败"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Generate ocserv no-route configs
        env:
          # inputs.* 只有 workflow_dispatch 才有值，其它事件为空串 → 回落默认值。
          # 用 shell 的 ${VAR:-default} 而不是 Actions 的 ||，
          # 避免 λ=0 这类取值被当成假值丢掉。
          TARGET_V4: ${{ inputs.target_v4 }}
          TARGET_V6: ${{ inputs.target_v6 }}
          PRUNE_V4: ${{ inputs.prune_v4 }}
          PRUNE_V6: ${{ inputs.prune_v6 }}
          # 精简档参数固定在下面，需要调整直接改这里的默认值即可。
          LITE_V4: ''
          LITE_V6: ''
        run: |
          set -euo pipefail
          TARGET_V4="${TARGET_V4:-1000}"
          TARGET_V6="${TARGET_V6:-800}"
          PRUNE_V4="${PRUNE_V4:-1}"
          PRUNE_V6="${PRUNE_V6:-0}"
          LITE_V4="${LITE_V4:-320}"
          LITE_V6="${LITE_V6:-384}"
          echo "event=${GITHUB_EVENT_NAME}"

          gen() {  # $1=out-dir  $2=v4 条数  $3=v6 条数  $4=IPv4 λ  $5=IPv6 λ
            echo "=== $1: target_v4=$2 target_v6=$3 prune_v4=$4 prune_v6=$5 ==="
            python3 .github/scripts/norange.py \
              --out-dir "$1" \
              --target-v4 "$2" \
              --target-v6 "$3" \
              --prune-v4  "$4" \
              --prune-v6  "$5"
            for f in ipv4 ipv6; do
              echo "--- $1/no-route-${f}.conf ---"
              head -6 "$1/no-route-${f}.conf"
              printf 'no-route lines: %s\n' "$(grep -c '^no-route' "$1/no-route-${f}.conf" || true)"
            done
          }

          # 标准档：条数预算按族独立计算，两个终端平台都能安全加载
          gen ocserv      "$TARGET_V4" "$TARGET_V6" "$PRUNE_V4" "$PRUNE_V6"
          # 精简档：路由表容量受限的老客户端用这套
          gen ocserv/lite "$LITE_V4"   "$LITE_V6"    "$PRUNE_V4" "$PRUNE_V6"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update ocserv NoRoute config"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
